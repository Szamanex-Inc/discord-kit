name: PR title

# PRs are squash-merged with the title as the commit message, so the title must follow
# Conventional Commits (see CONTRIBUTING.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            setup
            bot
            config
            presets
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The description must start with a lowercase letter.
